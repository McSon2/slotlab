<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SlotLab</title>
<style>
  :root {
    --bg: oklch(0.15 0.012 165);
    --bg-deep: oklch(0.12 0.01 165);
    --text: oklch(0.92 0.01 165);
    --text-dim: oklch(0.62 0.015 165);
    --gold: oklch(0.82 0.13 88);
    --gold-ink: oklch(0.24 0.05 88);
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
    overflow: hidden;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: radial-gradient(
      900px 500px at 50% 32%,
      oklch(0.19 0.02 165) 0%,
      var(--bg) 55%,
      var(--bg-deep) 100%
    );
  }
  .chip {
    display: grid;
    place-items: center;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--gold-ink);
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 0.02em;
    box-shadow:
      0 0 0 6px oklch(0.15 0.012 165),
      0 0 0 8px oklch(0.82 0.13 88 / 0.35),
      0 18px 50px oklch(0.82 0.13 88 / 0.18);
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }
  .name {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: blink 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="chip">SL</div>
    <div class="name">SlotLab</div>
    <div class="status">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span>Starting the local server…</span>
    </div>
  </div>
</body>
</html>
