[workspace]
resolver = "2"
members = [
    "crates/slotlab-core",
    "crates/slotlab-app",
    "crates/slotlab-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
