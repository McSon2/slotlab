# Desktop app release: on a `v*` tag, builds a UNIVERSAL macOS binary
# (Apple Silicon + Intel in one .dmg), signs + notarizes it with the Apple
# Developer ID, and publishes a GitHub release.
#
# NOTE: GitHub only reads workflows at the REPO root — this file is active
# once slotlab lives in its own (public) repository.
#
# Required repo secrets (same material as the SSP pipeline):
#   APPLE_CERTIFICATE              base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD     password of the .p12
#   APPLE_SIGNING_IDENTITY         e.g. "Developer ID Application: <name> (<team>)"
#   APPLE_ID                       Apple ID email (notarization)
#   APPLE_PASSWORD                 app-specific password (notarization)
#   APPLE_TEAM_ID                  team identifier
name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # same major as the lockfile's author: overrides/allowBuilds live in pnpm-workspace.yaml
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The UI is embedded into the binary at compile time (rust-embed on
      # frontend/dist) — build it before the Rust build.
      - name: Build frontend
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: crates/slotlab-desktop
          args: --target universal-apple-darwin
          tagName: v__VERSION__
          releaseName: 'SlotLab v__VERSION__'
          releaseBody: 'Download the .dmg below, open it and drag SlotLab into Applications.'
          releaseDraft: true
